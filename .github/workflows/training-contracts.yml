name: Training contracts

on:
  push:
    paths:
      - ".github/workflows/training-contracts.yml"
      - "research/training/**"
      - "research/data_generation/obruxo_data/**"
      - "research/modelling/basic_pitch/obruxo_basic_pitch/**"
      - "research/modelling/basic_pitch/artifacts/**"
  pull_request:
    paths:
      - ".github/workflows/training-contracts.yml"
      - "research/training/**"
      - "research/data_generation/obruxo_data/**"
      - "research/modelling/basic_pitch/obruxo_basic_pitch/**"
      - "research/modelling/basic_pitch/artifacts/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/training/requirements-contracts.txt
      - name: Install static contract dependencies
        run: python -m pip install -r research/training/requirements-contracts.txt
      - name: Lint
        run: ruff check research/training/obruxo_training research/training/tests research/training/run.py
      - name: Test contracts without a GPU or native synth
        run: python -m pytest research/training/tests research/data_generation/tests/unit/test_render.py -q

  trainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/training/requirements-trainer.txt
      - name: Install CPU trainer dependencies
        run: |
          python -m pip install -r research/training/requirements-trainer.txt
          python -m pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test frozen frontend, inference, interrupted recovery and evaluation
        run: python -m pytest research/training/tests/test_training.py -q
